<?xml version="1.0" encoding="UTF-8"?>
<!-- OPTICAL_LAYOUT.svg - preliminary optical layout (v0.3-prelim) -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>
    .label { font-family: Arial, sans-serif; font-size:14px; fill:#111111 }
    .title { font-family: Arial, sans-serif; font-size:18px; font-weight:bold }
    .note { font-family: Arial, sans-serif; font-size:12px; fill:#333333 }
    .outline { fill:none; stroke:#444444; stroke-width:2 }
    .dashed { stroke-dasharray:6 4 }
  </style>

  <rect x="20" y="20" width="1160" height="560" class="outline"/>
  <text x="40" y="50" class="title">REAL Color Mate — Optical Layout (v0.3-prelim)</text>

  <!-- Sample area -->
  <rect x="140" y="220" width="200" height="120" fill="#eeeeee" stroke="#999999"/>
  <text x="160" y="210" class="label">Sample (measurement area)</text>

  <!-- Illuminator -->
  <g>
    <rect x="20" y="180" width="90" height="240" fill="#fff2cc" stroke="#cc9900"/>
    <text x="30" y="170" class="label">Illuminator</text>
    <text x="30" y="450" class="note">LED array — model: TBD</text>
  </g>

  <!-- Diffuser -->
  <line x1="110" y1="300" x2="140" y2="300" stroke="#888" stroke-width="2" class="dashed"/>
  <text x="115" y="290" class="label">Diffuser (TBD)</text>

  <!-- Lens -->
  <g>
    <ellipse cx="520" cy="280" rx="60" ry="120" fill="#d0e8ff" stroke="#3b7dd8"/>
    <text x="480" y="170" class="label">Collection optics / Lens group</text>
    <text x="480" y="190" class="note">Prescription: TBD</text>
  </g>

  <!-- Sensor -->
  <rect x="680" y="230" width="120" height="100" fill="#f2f2f2" stroke="#666"/>
  <text x="690" y="220" class="label">Sensor module</text>
  <text x="690" y="350" class="note">Model & spectral responsivity: TBD</text>

  <!-- Optical axis -->
  <line x1="240" y1="280" x2="680" y2="280" stroke="#444" stroke-width="1"/>
  <text x="460" y="260" class="label">Optical axis</text>

  <!-- Dimensions / annotations (TBD) -->
  <text x="40" y="520" class="note">Layout notes: All mechanical locations, fastener points, and exact dimensions remain TBD. This SVG is a conceptual diagram for preliminary design only.</text>

  <text x="40" y="540" class="note">Document: v0.3-prelim — Preliminary Design. Do not finalize tolerances or dimensions in this file.</text>
</svg>
